# The build and publish pipeline, called by build.yml (pull requests) and
# publish.yml (main and manual runs). Read docs/04-ci-keyless.md alongside it.
#
# Every job authenticates with a GitHub OIDC token as the Basic password. Which
# robot that token becomes is decided in Harbor by claim rules, not here: a
# pull_request token maps to the read-only todomvc-ci-pr robot, any other token
# from this repository to todomvc-ci, which can push.

name: pipeline

on:
  workflow_call:
    inputs:
      publish:
        description: Push artifacts. The registry refuses it for pull_request tokens anyway.
        type: boolean
        default: false

env:
  REGISTRY: demo.container-registry.com
  NPM_URL: https://demo.container-registry.com/npm/todomvc-npm/
  MAVEN_URL: https://demo.container-registry.com/maven/todomvc-maven
  # The multi-project: app images, the Helm chart, and Docker Hub through its sub-project.
  OCI_PROJECT: demo.container-registry.com/todomvc

jobs:
  # Release versions are immutable in Harbor, so every run publishes a new one.
  # "Re-run failed jobs" keeps run_number, so the attempt is part of the version.
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          v="0.1.${{ github.run_number }}"
          [ "${{ github.run_attempt }}" = "1" ] || v="$v-rc${{ github.run_attempt }}"
          echo "version=$v" >> "$GITHUB_OUTPUT"

  maven:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/todo-api
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
      - id: auth
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Build through the todomvc-maven proxy cache
        env:
          HARBOR_USERNAME: ${{ steps.auth.outputs.username }}
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: |
          mvn -B -s .mvn/settings.xml versions:set -DnewVersion="${{ needs.version.outputs.version }}" -DgenerateBackupPoms=false
          mvn -B -s .mvn/settings.xml verify
      # A fresh token: GitHub's is valid for 5 minutes, and the build above can outlast it.
      - id: auth-publish
        if: inputs.publish
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Publish the jar
        if: inputs.publish
        env:
          HARBOR_USERNAME: ${{ steps.auth-publish.outputs.username }}
          HARBOR_PASSWORD: ${{ steps.auth-publish.outputs.password }}
        run: |
          mvn -B -s .mvn/settings.xml deploy -DskipTests
          echo "Published \`com.containerregistry.todo:todo-api:${{ needs.version.outputs.version }}\` to $MAVEN_URL" >> "$GITHUB_STEP_SUMMARY"

  npm:
    needs: version
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/todo-ui
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - id: auth
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Authenticate npm
        env:
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: |
          # Harbor reads HTTP Basic from _auth; _authToken is not accepted.
          auth="$(printf 'jwt:%s' "$HARBOR_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          echo "//${NPM_URL#https://}:_auth=$auth" >> .npmrc
      - name: Install through the todomvc-npm proxy cache
        run: npm ci
      - run: npm run build
      - name: Publish the package
        if: inputs.publish
        run: |
          npm version "${{ needs.version.outputs.version }}" --no-git-tag-version
          npm publish
          echo "Published \`todomvc-todo-ui@${{ needs.version.outputs.version }}\` to $NPM_URL" >> "$GITHUB_STEP_SUMMARY"

  images:
    needs: version
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [todo-api, todo-ui]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - id: auth
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Log in to the registry
        # Through the environment, so the token is never on a command line.
        env:
          HARBOR_USERNAME: ${{ steps.auth.outputs.username }}
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: printf '%s' "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u "$HARBOR_USERNAME" --password-stdin
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0
      - uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: apps/${{ matrix.app }}
          load: true
          provenance: false
          # Base images resolve through the multi-project, which serves them from its
          # Docker Hub sub-project. The login above is what lets buildx read it.
          build-args: |
            BASE_REGISTRY=${{ env.OCI_PROJECT }}/library
          tags: |
            ${{ env.OCI_PROJECT }}/${{ matrix.app }}:${{ github.sha }}
            ${{ env.OCI_PROJECT }}/${{ matrix.app }}:${{ needs.version.outputs.version }}
      # A fresh token: GitHub's is valid for 5 minutes, and the build above can outlast it.
      - id: auth-publish
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Pushing is refused for pull_request tokens
        if: ${{ !inputs.publish }}
        env:
          HARBOR_PASSWORD: ${{ steps.auth-publish.outputs.password }}
          IMAGE: ${{ env.OCI_PROJECT }}/${{ matrix.app }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u jwt --password-stdin
          if docker push "$IMAGE:${{ github.sha }}"; then
            echo "::error::a pull_request token was allowed to push"; exit 1
          fi
          echo "Push with the pull_request token was refused, as intended." >> "$GITHUB_STEP_SUMMARY"
      - name: Push
        if: inputs.publish
        env:
          HARBOR_PASSWORD: ${{ steps.auth-publish.outputs.password }}
          IMAGE: ${{ env.OCI_PROJECT }}/${{ matrix.app }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u jwt --password-stdin
          docker push --all-tags "$IMAGE"
          echo "Pushed \`$IMAGE:${{ github.sha }}\`" >> "$GITHUB_STEP_SUMMARY"

  chart:
    needs: [version, images]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Package
        # appVersion is the commit, so the chart deploys exactly the images built above.
        run: |
          helm version --short
          helm lint deploy/chart/todomvc
          helm package deploy/chart/todomvc --version "${{ needs.version.outputs.version }}" --app-version "${{ github.sha }}"
      - id: auth
        if: inputs.publish
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Push as OCI
        if: inputs.publish
        env:
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | helm registry login "$REGISTRY" -u jwt --password-stdin
          helm push "todomvc-${{ needs.version.outputs.version }}.tgz" "oci://$OCI_PROJECT/charts"
          echo "Published chart \`oci://$OCI_PROJECT/charts/todomvc:${{ needs.version.outputs.version }}\`" >> "$GITHUB_STEP_SUMMARY"

  # Read everything back on a clean runner. Publishing that is never read back proves nothing.
  verify:
    needs: [version, maven, npm, images, chart]
    if: inputs.publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          java-version: '21'
          distribution: temurin
      - id: auth
        uses: ./.github/actions/8gcr-token
        with:
          audience: ${{ env.REGISTRY }}
      - name: Images and chart
        env:
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: |
          printf '%s' "$HARBOR_PASSWORD" | docker login "$REGISTRY" -u jwt --password-stdin
          printf '%s' "$HARBOR_PASSWORD" | helm registry login "$REGISTRY" -u jwt --password-stdin
          for app in todo-api todo-ui; do docker pull "$OCI_PROJECT/$app:${{ github.sha }}"; done
          helm show chart "oci://$OCI_PROJECT/charts/todomvc" --version "${{ needs.version.outputs.version }}"
      - name: npm package
        env:
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: |
          auth="$(printf 'jwt:%s' "$HARBOR_PASSWORD" | base64 | tr -d '\n')"
          echo "::add-mask::$auth"
          cd "$(mktemp -d)"
          printf 'registry=%s\n//%s:_auth=%s\n' "$NPM_URL" "${NPM_URL#https://}" "$auth" > .npmrc
          npm view "todomvc-todo-ui@${{ needs.version.outputs.version }}" name version dist.tarball
      - name: Maven artifact
        env:
          HARBOR_USERNAME: jwt
          HARBOR_PASSWORD: ${{ steps.auth.outputs.password }}
        run: |
          # A cold local repository, so a hit proves the jar came back over the network.
          mvn -B -s apps/todo-api/.mvn/settings.xml -Dmaven.repo.local="$(mktemp -d)" \
            dependency:get -Dtransitive=false \
            -Dartifact="com.containerregistry.todo:todo-api:${{ needs.version.outputs.version }}"
