# Checks the Homebrew example without credentials: the setup script compiles and
# runs its argument parsing.
# The proxy itself needs the robot secret and is part of the walkthrough.
name: artifact homebrew

on:
  pull_request:
    paths: [artifact-types/homebrew/**, lib/**, .github/workflows/artifact-homebrew.yml]
  push:
    branches: [main]
    paths: [artifact-types/homebrew/**, lib/**, .github/workflows/artifact-homebrew.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifact-types/homebrew
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 setup.py --help
