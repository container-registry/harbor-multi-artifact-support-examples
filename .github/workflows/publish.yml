# Publish entry point: pushes to main, and manual runs on any branch of this repository.
#
# Starting a workflow_dispatch run needs write access to the repository, the same
# access that pushing to main needs, so a manual run on a branch grants nothing new.
# Harbor's claim rule (repository = this repo, any event but pull_request) decides
# which tokens may push.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    uses: ./.github/workflows/_pipeline.yml
    permissions:
      contents: read
      id-token: write
    with:
      publish: true
