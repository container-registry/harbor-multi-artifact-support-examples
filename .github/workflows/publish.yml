# Publish entry point: main and manual runs only.
#
# Code reaching this path has been merged, so granting `id-token: write` here is a
# deliberate trust decision rather than an accident of workflow scope. This is the
# only file in the repository that grants it.

name: publish

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  pipeline:
    # workflow_dispatch lets a maintainer pick any ref, which would run that
    # branch's build code with id-token: write and publish: true and defeat the
    # whole point of splitting the workflows. The push trigger is already
    # main-only; this guard is what constrains the manual path.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/_pipeline.yml
    permissions:
      contents: read
      id-token: write     # mints the short-lived registry credential
    with:
      publish: true
