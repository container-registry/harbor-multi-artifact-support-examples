# Checks the Helm example without credentials: the setup script compiles and the
# sample chart lints, renders and packages. Pushing needs a robot secret.
name: artifact helm

on:
  pull_request:
    paths: [artifact-types/helm/**, lib/**, .github/workflows/artifact-helm.yml]
  push:
    branches: [main]
    paths: [artifact-types/helm/**, lib/**, .github/workflows/artifact-helm.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifact-types/helm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - run: python3 setup.py --help
      - run: |
          helm version --short
          helm lint sample
          helm template t sample
          helm package sample
