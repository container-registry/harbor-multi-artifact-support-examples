# Checks the npm example without credentials: the setup script compiles and the
# sample installs through the public npmjs proxy and packs. Publishing needs a
# robot secret and is part of the walkthrough, not of CI.
name: artifact npm

on:
  pull_request:
    paths: [artifact-types/npm/**, lib/**, .github/workflows/artifact-npm.yml]
  push:
    branches: [main]
    paths: [artifact-types/npm/**, lib/**, .github/workflows/artifact-npm.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifact-types/npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python3 setup.py --help
      - name: Resolve through the proxy and pack
        working-directory: artifact-types/npm/sample
        run: |
          npm view left-pad version
          npm pack --dry-run
