# Checks the npm example without credentials: the setup script's imports and
# arguments, an install of a public package through the npmjs proxy with the
# sample's .npmrc, and what the sample would pack. Publishing needs a robot
# secret and is part of the walkthrough, not of CI.
name: artifact npm

on:
  pull_request:
    paths: [artifact-types/npm/**, lib/**, .github/workflows/artifact-npm.yml]
  push:
    branches: [main]
    paths: [artifact-types/npm/**, lib/**, .github/workflows/artifact-npm.yml]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: artifact-types/npm
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: python3 setup.py --help
      - name: Install through the proxy and pack
        working-directory: artifact-types/npm/sample
        env:
          HARBOR_URL: https://demo.container-registry.com
        run: |
          npm install --no-save --ignore-scripts --loglevel http left-pad 2>&1 | grep -E 'fetch GET 200 .*/npm/npmjs/'
          npm pack --dry-run
