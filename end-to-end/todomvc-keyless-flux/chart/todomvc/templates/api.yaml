{{- $ctx := dict "root" . "name" "todo-api" }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  labels: {{- include "todomvc.labels" $ctx | nindent 4 }}
spec:
  replicas: {{ .Values.api.replicas }}
  selector:
    matchLabels: {{- include "todomvc.labels" $ctx | nindent 6 }}
  template:
    metadata:
      labels: {{- include "todomvc.labels" $ctx | nindent 8 }}
    spec:
      serviceAccountName: {{ .Values.serviceAccountName }}
      containers:
        - name: todo-api
          image: {{ include "todomvc.image" $ctx }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
          readinessProbe:
            httpGet:
              path: /api/todos
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
  labels: {{- include "todomvc.labels" $ctx | nindent 4 }}
spec:
  selector: {{- include "todomvc.labels" $ctx | nindent 4 }}
  ports:
    - name: http
      port: 8080
      targetPort: http
