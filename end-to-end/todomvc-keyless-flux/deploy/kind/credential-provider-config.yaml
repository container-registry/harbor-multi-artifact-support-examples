apiVersion: kubelet.config.k8s.io/v1
kind: CredentialProviderConfig
providers:
  - name: harbor-sa-credential-provider
    apiVersion: credentialprovider.kubelet.k8s.io/v1
    matchImages:
      - demo.container-registry.com
    defaultCacheDuration: 5m
    tokenAttributes:
      # The token's aud. Must equal the audience of the trusted issuer in Harbor.
      serviceAccountTokenAudience: demo.container-registry.com
      requireServiceAccount: true
      # Token, not ServiceAccount: the kubelet refuses a provider that returns the
      # service account token itself as the password under any other cache type.
      cacheType: Token
