apiVersion: v1
kind: Namespace
metadata:
  name: todomvc
---
# One identity for both pulls: source-controller mints this account's token to
# fetch the chart, and the kubelet mints it to pull the images of pods that run
# as it. Harbor maps the token's sub claim to a pull-only robot.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todomvc
  namespace: todomvc
  annotations:
    credential.auth.fluxcd.io/provider: kubernetes
    credential.auth.fluxcd.io/type: jwt
    credential.auth.fluxcd.io/audiences: demo.container-registry.com
    # Harbor reads the token from the Basic password; the username is ignored.
    credential.auth.fluxcd.io/username: jwt
---
# Flux 2.10 no longer grants source-controller serviceaccounts/token by default.
# A namespaced grant for this one account is all it needs.
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: flux-mint-todomvc-token
  namespace: todomvc
rules:
  - apiGroups: [""]
    resources: ["serviceaccounts/token"]
    resourceNames: ["todomvc"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flux-mint-todomvc-token
  namespace: todomvc
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: flux-mint-todomvc-token
subjects:
  - kind: ServiceAccount
    name: source-controller
    namespace: flux-system
